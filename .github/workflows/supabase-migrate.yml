name: Database migrations

# Applies new files in supabase/migrations to the production Supabase project on every push to main.
# Uses the Supabase Management API (SQL endpoint), so only an access token is needed – no database password.
# Required repository secret: SUPABASE_ACCESS_TOKEN. Optional: SUPABASE_PROJECT_REF (otherwise the project named "de-proposals" is used).

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        run: |
          TOKEN="$(echo -n "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN is not set – skipping."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          if [[ "$TOKEN" != sbp_* ]]; then echo "::error::SUPABASE_ACCESS_TOKEN should start with sbp_."; exit 1; fi
          CODE=$(curl -s -o /tmp/projects.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects")
          if [ "$CODE" = "401" ]; then echo "::error::SUPABASE_ACCESS_TOKEN was rejected (401). Create a new access token and update the secret."; exit 1; fi
          if [ "$CODE" != "200" ]; then echo "::error::Supabase API returned $CODE"; exit 1; fi
          REF="$(echo -n "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')"
          if ! jq -e --arg r "$REF" 'any(.[]; .id == $r)' /tmp/projects.json >/dev/null; then
            REF=$(jq -r '[.[] | select(.name == "de-proposals")][0].id // empty' /tmp/projects.json)
            [ -z "$REF" ] && [ "$(jq length /tmp/projects.json)" = "1" ] && REF=$(jq -r '.[0].id' /tmp/projects.json)
            if [ -z "$REF" ]; then
              echo "::error::Could not find the Supabase project. Projects visible to this token: $(jq -r '[.[] | .name + " (" + .id + ")"] | join(", ")' /tmp/projects.json)"
              exit 1
            fi
          fi
          echo "::notice::Project URL: https://$REF.supabase.co"
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "::add-mask::$TOKEN"

      - name: Apply migrations
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          sql() {
            # $1 = SQL text. Prints the JSON result; fails with a readable error.
            local body code
            body=$(jq -n --arg q "$1" '{query: $q}')
            code=$(curl -s -o /tmp/res.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data "$body" "https://api.supabase.com/v1/projects/$REF/database/query")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::SQL failed ($code): $(head -c 900 /tmp/res.json)"
              return 1
            fi
            cat /tmp/res.json
          }

          sql "create schema if not exists app_meta; create table if not exists app_meta.migrations (name text primary key, applied_at timestamptz not null default now());" > /dev/null
          APPLIED=$(sql "select coalesce(json_agg(name), '[]'::json) as names from app_meta.migrations;" | jq -r '.[0].names[]?' || true)

          COUNT=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            NAME=$(basename "$f")
            if echo "$APPLIED" | grep -qx "$NAME"; then echo "✓ already applied: $NAME"; continue; fi
            echo "→ applying $NAME"
            ESCAPED=$(printf "%s" "$NAME" | sed "s/'/''/g")
            # one request = one transaction: the migration and its bookkeeping row succeed or fail together
            sql "begin;
          $(cat "$f")
          ;
          insert into app_meta.migrations (name) values ('$ESCAPED');
          commit;" > /dev/null
            COUNT=$((COUNT+1))
          done
          echo "::notice::Applied $COUNT new migration(s)."
