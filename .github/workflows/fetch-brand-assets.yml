name: Fetch brand assets

# One-off helper: downloads logo files from the company website into public/brand and commits them.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p public/brand
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for pair in "logo.png|https://digitaleffective.co.il/wp-content/uploads/2020/03/DE_logo.png" \
                      "logo-long.png|https://digitaleffective.co.il/wp-content/uploads/2020/02/DE_long.png" \
                      "logo-cropped.png|https://digitaleffective.co.il/wp-content/uploads/2020/03/cropped-DE_logo-1-1024x131.png"; do
            name="${pair%%|*}"; url="${pair#*|}"
            code=$(curl -sL -A "$UA" -o "public/brand/$name" -w "%{http_code}" "$url")
            echo "$name -> $code $(file -b public/brand/$name)"
            if [ "$code" != "200" ] || ! file -b "public/brand/$name" | grep -qi image; then rm -f "public/brand/$name"; fi
          done
          ls -la public/brand
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Add brand logo files from company website" && git push
